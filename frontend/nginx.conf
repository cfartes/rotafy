server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-src 'none'; script-src 'self' 'sha256-QGCVwpJ3KYDrPy8YNi+Ey6/H+PSnm2sIO+mV2v3hwp8=' 'sha256-WL0rl/a4kNbkYLRlqXm0D3Y/ba6MqbuMYwFsyUWpLgo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ^~ /api/v1/public/bilhete/ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/nexus/mobile-release {
        client_max_body_size 150m;
        proxy_read_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Retired public editable deck URL must never be served or cached.
    location = /documentacao/apresentacao.pptx { expires -1; return 404; }
    location = /version.json { expires -1; etag off; try_files $uri =404; }
    location = /sw.js { expires -1; try_files $uri =404; }
    # Ticket paths contain a private bearer credential. Do not log them.
    location /b/ { access_log off; expires -1; try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }
}
