const slides=[...document.querySelectorAll('.slide')];let current=0;function go(delta){current=Math.max(0,Math.min(slides.length-1,current+delta));slides[current].scrollIntoView({behavior:'smooth',block:'start'});}document.getElementById('anterior').onclick=()=>go(-1);document.getElementById('proximo').onclick=()=>go(1);document.getElementById('tela-cheia').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('tela-cheia').textContent='Use a tela cheia do navegador';}};document.addEventListener('keydown',event=>{if(event.target instanceof HTMLInputElement)return;if(event.key==='ArrowRight'){event.preventDefault();go(1);}if(event.key==='ArrowLeft'){event.preventDefault();go(-1);}});const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)current=slides.indexOf(entry.target);},{threshold:0.55});slides.forEach(slide=>observer.observe(slide));
